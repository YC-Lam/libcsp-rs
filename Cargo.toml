[package]
name = "csp"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-time = {version = "0.5", optional = true}
embassy-sync = {version = "0.8", optional = true}
tokio = {version = "1", optional = true, features = ["sync", "time"]}
smol = {version = "2.0", optional = true}
bitflags = "2.13"

[target.'cfg(any(unix, target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["sysinfoapi", "errhandlingapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[dev-dependencies]
tokio = {version = "1", features = ["full"]}
serial_test = "4.0"

[features]
default = ["tokio", "promisc", "rdp", "hmac"]
promisc = []
rdp = []
hmac = []
embassy = ["dep:embassy-sync", "dep:embassy-time"]
tokio = ["dep:tokio", "dep:smol"]