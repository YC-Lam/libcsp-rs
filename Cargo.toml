[package]
name = "csp"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-time = {version = "0.5", optional = true}
embassy-sync = {version = "0.8", optional = true}
embassy-stm32 = {version = "0.6", optional = true}
embassy-executor = {version = "0.10", optional = true}
embedded-can = {version = "0.4", optional = true}
defmt = {version = "1", optional = true}
tokio = {version = "1", optional = true, features = ["sync", "time"]}
smol = {version = "2.0", optional = true}
bitflags = "2.13"

[target.'cfg(any(unix, target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["sysinfoapi", "errhandlingapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[dev-dependencies]
tokio = {version = "1", features = ["full"]}
serial_test = "4.0"
static_cell = "2.1"

[features]
default = ["tokio", "promisc", "rdp", "hmac"]
promisc = []
rdp = []
hmac = []
dedup_all = ["dedup_incoming", "dedup_forward"]
dedup_forward = []
dedup_incoming = []

embassy = ["dep:embassy-sync", "dep:embassy-time", "dep:defmt"]
embassy_stm32 = ["embassy", "dep:embassy-stm32", "dep:embedded-can", "dep:embassy-executor"]
embassy_stm32_time = ["embassy_stm32", "embassy-stm32/time"]

tokio = ["dep:tokio", "dep:smol"]

[[example]]
name = "can_stm32"
target = "thumbv7em-none-eabi"
required-features = ["embassy_stm32", "embassy_stm32_time", "embassy-stm32/stm32g431kb", "embassy-executor/executor-thread", "embassy-executor/platform-cortex-m"]